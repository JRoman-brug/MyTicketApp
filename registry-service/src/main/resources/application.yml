spring:
  application:
    name: service-registry
  output:
    ansi:
      enabled: always

server:
  port: 8761

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/