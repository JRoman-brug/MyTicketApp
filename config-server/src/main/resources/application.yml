spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config 
  output:
    ansi:
      enabled: always 
server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  client:
    service-url: 
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}