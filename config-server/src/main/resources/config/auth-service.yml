spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  output:
    ansi:
      enabled: ALWAYS

logging:
  level:
    com:
      jrb: debug

jwt:
  secret: ${JWT_SECRET_KEY:temporaSecretKeyMustBeVeryLongToWorkWithHS256Algorithm}
  expiration: ${JWT_EXPIRATION_TIME:3600000}