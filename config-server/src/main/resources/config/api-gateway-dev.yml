spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: ticket-service
            uri: lb://ticket-service
            predicates: 
              - Path=/api/movies/**, /api/hall/**, /api/showtimes/**, /api/tickets/**

server:
  port: 8060

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  client:
    service-url: 
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}