spring:
  datasource:
    url: jdbc:h2:mem:auth_db
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true  # Esto te permite entrar a /h2-console para ver las tablas
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop # Se borra todo al cerrar la app
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
server:
  port: 8081
logging:
  level:
    com:
      jrb: debug