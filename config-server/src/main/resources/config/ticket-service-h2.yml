spring:
  cloud:
    discovery:
      enabled: true
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:h2:mem:ticketdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true 
      path: /h2-console

logging:
  level:
    com.jrb.ticket_service: debug